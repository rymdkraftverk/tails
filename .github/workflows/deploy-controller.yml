name: deploy controller
on:
  push:
    branches: [master]

permissions:
  id-token: write
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - run: npm ci
        working-directory: controller

      - run: npm run build
        working-directory: controller
        env:
          REACT_APP_WS_ADDRESS: wss://rkv-signaling.fogpipe.cloud
          REACT_APP_VERSION: ${{ github.event.head_commit.timestamp }}-${{ github.sha }}

      - uses: fogpipe/cloud-actions/auth@v1
        with:
          service-account: a41e68ad-192a-4d38-aa77-0c65b48c6446

      - run: curl -fsSL https://raw.githubusercontent.com/fogpipe/cloud-cli/main/install.sh | sh

      - run: fpcloud website deploy tails-controller controller/dist --org rkv --project games
